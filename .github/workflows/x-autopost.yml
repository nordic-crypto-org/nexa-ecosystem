name: X autopost new entries
on:
  push:
    branches: [main]
    paths: [data.js]
  workflow_dispatch:
    inputs:
      dry_run: {type: boolean, default: true}
permissions:
  contents: write
concurrency: {group: x-autopost, cancel-in-progress: false}
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Post new entries
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          BEFORE: ${{ github.event.before }}
        run: |
          args=(--before "${BEFORE:-HEAD~1}")
          [ "${{ inputs.dry_run }}" = "true" ] && args+=(--dry-run)
          python3 tools/x_autopost.py "${args[@]}"
      - name: Commit ledger
        if: always()
        run: |
          git diff --quiet tools/x_posted.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update X posted ledger [skip ci]" tools/x_posted.json
          git pull --rebase -q && git push
